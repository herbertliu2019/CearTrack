<div class="marks-cap">Mark · auto-generated, not editable — click Copy</div>
<div class="marks-row" x-data="{ copied: false }">
  <input type="text" readonly tabindex="-1" id="marks-text" value="{{ marks }}" placeholder="(none — no missing accessories)" title="Auto-generated from your entries; use Copy">
  <button type="button" class="con-btn ghost"
          @click="copied = window.copyMarks(); setTimeout(() => copied = false, 1500)"
          x-text="copied ? 'Copied' : 'Copy'">Copy</button>
  <span class="res-badge {{ result|lower }}"><i></i>{{ result }}</span>
  {% if dead > max_dead %}
  <span class="ce-sticker" style="color:var(--fail);">Dead pixels {{ dead }} &gt; {{ max_dead }}</span>
  {% endif %}
</div>
