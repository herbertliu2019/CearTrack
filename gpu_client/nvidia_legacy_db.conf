# NVIDIA Legacy GPU Database
# =============================================================================
# Purpose: When nvidia-smi cannot read GPU info due to legacy driver issues,
#          gpu_test.sh uses this file to look up VRAM / chip specs via PCI Device ID.
#
# Scope:   Fermi (GF1xx) and Kepler (GK1xx) generations only.
#          Both generations are dropped by driver 535.xx — nvidia-smi fails entirely.
#          Maxwell / Pascal and newer are fully supported by driver 535.xx, not listed here.
#
# Format:  device_id:vram_mb:chip:vram_type:bus_width:driver_needed
#   device_id    : 4-digit lowercase hex; NVIDIA vendor ID is always 10de
#   vram_mb      : physical VRAM size in MB (integer)
#   chip         : GPU die name
#   vram_type    : memory type (GDDR5 / GDDR3 / DDR3)
#   bus_width    : memory bus width in bits
#   driver_needed: required legacy driver version
#
# Official sources:
#   Kepler → https://download.nvidia.com/XFree86/Linux-x86_64/470.256.02/README/supportedchips.html
#   Fermi  → https://download.nvidia.com/XFree86/Linux-x86_64/390.157/README/supportedchips.html
#
# Adding new entries: append a line at the end using the same format.
#   For unknown cards, look up specs at: https://www.techpowerup.com/gpu-specs/
# =============================================================================


